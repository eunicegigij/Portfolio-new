<svg xmlns="http://www.w3.org/2000/svg" width="920" height="780" viewBox="0 0 920 780" role="img" aria-label="Webhook Reliability Service architecture">
  <style>
    .title { font: 700 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .label { font: 600 13px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
    .tiny { font: 11px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #475569; }
    .onDark { fill: #f8fafc; }
  </style>
  <rect width="920" height="780" fill="#f8fafc"/>
  <text x="460" y="36" text-anchor="middle" class="title">Webhook Reliability Service</text>
  <text x="460" y="58" text-anchor="middle" class="tiny">At-least-once outbound delivery · HMAC-SHA256 · retries · DLQ · replay</text>

  <rect x="360" y="76" width="200" height="44" rx="8" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="460" y="103" text-anchor="middle" class="label">Client application</text>
  <line x1="460" y1="120" x2="460" y2="146" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="280" y="146" width="360" height="52" rx="8" fill="#1e293b" stroke="#0f172a"/>
  <text x="460" y="169" text-anchor="middle" class="label onDark">NestJS API  ·  API keys  ·  tenant isolation</text>
  <text x="460" y="186" text-anchor="middle" class="tiny" fill="#cbd5e1">POST /events returns before outbound HTTP</text>

  <line x1="460" y1="198" x2="460" y2="226" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="230" y="226" width="460" height="88" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="460" y="254" text-anchor="middle" class="label">PostgreSQL (source of truth)</text>
  <rect x="250" y="270" width="100" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="300" y="288" text-anchor="middle" class="tiny">events</text>
  <rect x="360" y="270" width="100" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="410" y="288" text-anchor="middle" class="tiny">endpoints</text>
  <rect x="470" y="270" width="100" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="520" y="288" text-anchor="middle" class="tiny">deliveries</text>
  <rect x="580" y="270" width="90" height="28" rx="4" fill="#ecfdf5" stroke="#0f766e"/>
  <text x="625" y="288" text-anchor="middle" class="tiny">attempts</text>

  <line x1="460" y1="314" x2="460" y2="342" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="300" y="342" width="320" height="56" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="460" y="366" text-anchor="middle" class="label">Redis / BullMQ</text>
  <text x="460" y="384" text-anchor="middle" class="tiny">delivery jobs · not the event store</text>

  <line x1="460" y1="398" x2="460" y2="426" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="300" y="426" width="320" height="56" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="450" text-anchor="middle" class="label">Delivery worker</text>
  <text x="460" y="468" text-anchor="middle" class="tiny">claim · sign HMAC · POST · timeout · classify</text>

  <line x1="380" y1="482" x2="250" y2="520" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="540" y1="482" x2="670" y2="520" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="140" y="520" width="220" height="64" rx="8" fill="#fff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="250" y="548" text-anchor="middle" class="label">Success (2xx)</text>
  <text x="250" y="568" text-anchor="middle" class="tiny">DELIVERED in PostgreSQL</text>

  <rect x="560" y="520" width="220" height="64" rx="8" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
  <text x="670" y="548" text-anchor="middle" class="label">Failure</text>
  <text x="670" y="568" text-anchor="middle" class="tiny">transient retry · permanent fail</text>

  <line x1="670" y1="584" x2="670" y2="616" stroke="#0f172a" stroke-width="1.5"/>

  <rect x="520" y="616" width="300" height="72" rx="8" fill="#fff" stroke="#be123c" stroke-width="1.5"/>
  <text x="670" y="644" text-anchor="middle" class="label">FAILED / DLQ + replay</text>
  <text x="670" y="664" text-anchor="middle" class="tiny">same event ID · new retry cycle</text>

  <rect x="140" y="616" width="220" height="72" rx="8" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="644" text-anchor="middle" class="label">Consumer HTTP</text>
  <text x="250" y="664" text-anchor="middle" class="tiny">X-Webhook-ID is the idempotency key</text>

  <text x="460" y="730" text-anchor="middle" class="tiny">At-least-once: a consumer may see the same event ID more than once.</text>
  <text x="460" y="750" text-anchor="middle" class="tiny">Do not claim exactly-once HTTP delivery.</text>
</svg>
